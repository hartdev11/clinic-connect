name: Nightly Quality Matrix

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

jobs:
  matrix-checks:
    name: Node ${{ matrix.node }} checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  flaky-smoke:
    name: Flaky Smoke Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Test run #1
        run: npm run test

      - name: Test run #2
        run: npm run test

      - name: Build smoke
        run: npm run build
